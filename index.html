<!doctype html>
<html lang="en">
<head>

  <title>Quack Attack 3D</title>
  <style>
    :root{--ink:#17324d;--cream:#fff9e9;--yellow:#ffd166;--coral:#ff6f61}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#f4b6c2;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.game-card{width:min(1120px,100%);height:min(760px,calc(100vh - 40px));min-height:520px;position:relative;overflow:hidden;border:4px solid var(--ink);border-radius:28px;background:#77cfe3;box-shadow:0 12px 0 rgba(23,50,77,.18),0 25px 50px rgba(79,43,86,.2)}#scene{display:block;width:100%;height:100%;cursor:none}.hud{position:absolute;z-index:4;left:20px;right:20px;top:18px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(20px,3vw,31px);letter-spacing:-1px;text-shadow:2px 2px 0 #fff}.duck-icon{width:42px;height:42px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);transform:rotate(-7deg);font-size:25px}.stats{display:flex;gap:10px}.pill{min-width:94px;padding:8px 14px;border:3px solid var(--ink);border-radius:14px;background:rgba(255,249,233,.92);box-shadow:3px 3px 0 rgba(23,50,77,.16);text-align:center}.pill small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:900;opacity:.6}.pill strong{display:block;font-size:24px;line-height:1.05}.round-label{position:absolute;z-index:4;top:89px;left:20px;padding:7px 12px;border:3px solid var(--ink);border-radius:12px;background:rgba(255,249,233,.88);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px}.progress{position:absolute;z-index:4;top:18px;left:50%;width:min(260px,28%);height:12px;transform:translateX(-50%);border:3px solid var(--ink);border-radius:20px;background:rgba(255,249,233,.75);overflow:hidden}.progress i{display:block;width:100%;height:100%;background:var(--coral     .hit-feedback{position:absolute;z-index:6;left:50%;top:39%;transform:translate(-50%,-50%) scale(.75);opacity:0;pointer-events:none;color:var(--cream);font-size:clamp(24px,4vw,42px);font-weight:900;letter-spacing:2px;text-align:center;text-shadow:4px 4px 0 var(--ink);transition:opacity .12s,transform .12s}.hit-feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.hit-feedback small{display:block;font-size:13px;letter-spacing:1px;color:var(--yellow)}.asset-status{position:absolute;z-index:4;right:20px;bottom:18px;padding:6px 10px;border:2px solid var(--ink);border-radius:12px;background:rgba(255,249,233,.8);font-size:10px;font-weight:900;letter-spacing:.7px}.power{display:none!important}

<body>

  <div class="tip" id="tip">CLICK TO FIRE • BB ROUNDS • AIM WITH THE CROSSHAIR</div><div class="asset-status" id="assetStatus">VSS: LOADING</div>
</section></main>
